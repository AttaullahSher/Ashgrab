<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Ashgrab">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3D9CFF"/>
      <stop offset="45%"  stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0066E0"/>
                </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff" stop-opacity=".38"/>
      <stop offset="52%"  stop-color="#fff" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- the download arrow is knocked out of the front sheet -->
    <mask id="cut">
      <rect width="100" height="100" fill="black"/>
      <rect x="34" y="30" width="42" height="42" rx="13" fill="white"/>
      <path d="M55,37.5 a3.6,3.6 0 0 1 3.6,3.6 v11.4 h5.6 a1.7,1.7 0 0 1 1.25,2.85
               l-9.2,9.9 a1.7,1.7 0 0 1 -2.5,0 l-9.2,-9.9 A1.7,1.7 0 0 1 45.8,52.5
               h5.6 v-11.4 a3.6,3.6 0 0 1 3.6,-3.6 z" fill="black"/>
    </mask>
  </defs>

  <!-- continuous-corner squircle -->
  <path id="sq" d="M50,0 C79.6,0 89.2,2.2 94.5,7.5 C99.8,12.8 100,22.4 100,50
    C100,77.6 99.8,87.2 94.5,92.5 C89.2,97.8 79.6,100 50,100 C20.4,100 10.8,97.8 5.5,92.5
    C0.2,87.2 0,77.6 0,50 C0,22.4 0.2,12.8 5.5,7.5 C10.8,2.2 20.4,0 50,0 Z" fill="url(#g)"/>

  <!-- two overlapping sheets, the front one carrying the arrow -->
  <rect x="22" y="20" width="42" height="42" rx="13" fill="#fff" opacity=".42"/>
  <rect x="34" y="30" width="42" height="42" rx="13" fill="#fff" mask="url(#cut)"/>

  <use href="#sq" fill="url(#gloss)"/>
</svg>
